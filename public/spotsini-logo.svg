        fill="none" />

  <!-- Inner Soft Accent Circle -->
  <circle cx="230" cy="275" r="95" fill="#FFE6D6" opacity="0.4" />

  <!-- Map Pin / Search Motif -->
  <!-- Outer Pin Arc & Tip -->
  <path d="M 230 155 C 295 155 345 205 345 270 C 345 320 305 365 255 405 L 230 425 L 205 405 C 160 368 120 320 120 270 C 120 205 170 155 230 155 Z" 
        stroke="url(#pinGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Inner Search Ring -->
  <circle cx="230" cy="265" r="52" 
          stroke="url(#pinGrad)" 
          stroke-width="24" 
          fill="none" />

  <!-- Magnifying Glass Handle / Accent Line -->
  <path d="M 268 302 L 315 350" 
