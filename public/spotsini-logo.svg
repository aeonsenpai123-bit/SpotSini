<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none">
  <defs>
    <linearGradient id="spotsiniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="60%" stop-color="#E05B26" />
      <stop offset="100%" stop-color="#B84418" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFA050" />
      <stop offset="50%" stop-color="#E8642A" />
      <stop offset="100%" stop-color="#AF3810" />
    </linearGradient>
  </defs>

  <!-- House Outline -->
  <path d="M 250 50 L 440 205 L 395 205 L 395 380 L 105 380 L 105 205 L 60 205 Z" 
